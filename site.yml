- name: Raspberry Pi 4 - Headless Docker Host Setup
  hosts: rp4
  become: true
  pre_tasks:
    - name: Check for local secret files
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/{{ item }}"
      loop:
        - .tailscale_rp4.key
        - .zot_mirror
      delegate_to: localhost
      become: false
      register: secret_files

    - name: Load Tailscale auth key (if present)
      ansible.builtin.set_fact:
        tailscale_auth_key: "{{ lookup('file', playbook_dir + '/.tailscale_rp4.key') }}"
      when: secret_files.results[0].stat.exists
      no_log: true

    - name: Load Zot mirror (if present)
      ansible.builtin.set_fact:
        zot_mirror: "{{ lookup('file', playbook_dir + '/.zot_mirror') }}"
      when: secret_files.results[1].stat.exists
      no_log: true

  tasks:
    - name: Update system
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist

    - name: Install security packages and bootstrap prerequisites
      ansible.builtin.apt:
        name:
          - ufw
          - fail2ban
          - unattended-upgrades
          - apt-transport-https
          - ca-certificates  # also managed by mise; needed here for HTTPS apt repos
          - curl             # also managed by mise; used to bootstrap mise
          - git              # pre-mise prerequisite: clone the configs repo
          - gnupg            # also managed by mise; needed here for apt_key
          - lsb-release
        state: present

    - name: Enable unattended upgrades
      ansible.builtin.lineinfile:
        path: /etc/apt/apt.conf.d/20auto-upgrades
        regexp: '^{{ item.regexp }}'
        line: "{{ item.line }}"
        mode: '644'
        create: true
      with_items:
        - { regexp: 'APT::Periodic::Update-Package-Lists', line: 'APT::Periodic::Update-Package-Lists "1";' }
        - { regexp: 'APT::Periodic::Download-Upgradeable-Packages', line: 'APT::Periodic::Download-Upgradeable-Packages "1";' }
        - { regexp: 'APT::Periodic::AutocleanInterval', line: 'APT::Periodic::AutocleanInterval "7";' }
        - { regexp: 'APT::Periodic::Unattended-Upgrade', line: 'APT::Periodic::Unattended-Upgrade "1";' }

    - name: Remove Ansible security-only override (rely on distro default security + stable)
      ansible.builtin.blockinfile:
        path: /etc/apt/apt.conf.d/50unattended-upgrades
        marker: "// {mark} ANSIBLE MANAGED SECURITY BLOCK"
        state: absent

    - name: Enable and configure UFW
      community.general.ufw:
        rule: allow
        name: OpenSSH

    - name: Enable UFW
      community.general.ufw:
        state: enabled

    - name: Allow tailnet range through UFW
      community.general.ufw:
        rule: allow
        src: 100.64.0.0/10

    - name: Disable SSH password login
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'
        state: present
      notify: Restart SSH

    - name: Add Docker repository and key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/debian/gpg
        state: present

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=arm64] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker and Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Add user to docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    - name: Check existing Docker daemon.json
      ansible.builtin.stat:
        path: /etc/docker/daemon.json
      register: docker_daemon_file

    - name: Read existing Docker daemon.json
      ansible.builtin.slurp:
        src: /etc/docker/daemon.json
      register: docker_daemon_raw
      when: docker_daemon_file.stat.exists

    - name: Enable Docker live-restore (keep containers up across daemon restarts)
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        mode: '0644'
        content: "{{ existing_config | combine(daemon_extra) | to_nice_json }}\n"
      vars:
        existing_config: "{{ (docker_daemon_raw.content | b64decode | from_json) if docker_daemon_file.stat.exists else {} }}"
        daemon_extra: "{{ {'live-restore': true, 'registry-mirrors': ['http://' ~ zot_mirror],
                          'insecure-registries': [zot_mirror]}
                         if zot_mirror is defined else {'live-restore': true} }}"
      notify: Restart Docker

    - name: Remove Portainer (replaced by Dozzle)
      community.docker.docker_container:
        name: portainer
        state: absent

    - name: Install Dozzle (container log dashboard)
      community.docker.docker_container:
        name: dozzle
        image: amir20/dozzle:v11.3.0
        state: started
        restart_policy: always
        published_ports:
          - "80:8080"
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock:ro
        env:
          DOZZLE_AUTH_PROVIDER: "none"
          DOZZLE_DISABLE_SETUP_WIZARD: "true"
          DOZZLE_ENABLE_ACTIONS: "false"
          DOZZLE_ENABLE_SHELL: "false"
          DOZZLE_ENABLE_MCP: "false"
          DOZZLE_NO_ANALYTICS: "true"

    - name: Add Tailscale apt keyring
      ansible.builtin.apt_key:
        url: "https://pkgs.tailscale.com/stable/debian/{{ ansible_distribution_release }}.noarmor.gpg"
        state: present

    - name: Add Tailscale apt repository
      ansible.builtin.apt_repository:
        repo: "deb https://pkgs.tailscale.com/stable/debian {{ ansible_distribution_release }} main"
        state: present

    - name: Install Tailscale
      ansible.builtin.apt:
        name: tailscale
        state: present
        update_cache: true

    - name: Enable and start tailscaled
      ansible.builtin.service:
        name: tailscaled
        state: started
        enabled: true

    - name: Connect to tailnet
      ansible.builtin.shell: >
        tailscale status >/dev/null 2>&1 ||
        tailscale up --hostname rp4 --authkey {{ tailscale_auth_key }}
      no_log: true
      changed_when: false
      when: tailscale_auth_key is defined


    - name: Install rsync (not provided by mise)
      ansible.builtin.apt:
        name: rsync
        state: present

    - name: Clone personal configs repo (source of mise bootstrap)
      ansible.builtin.git:
        repo: https://github.com/endlesslycurious/configs.git
        dest: "/home/{{ ansible_user }}/configs"
        version: master
        recursive: true               # nvim kickstart fork + catppuccin
      become: true
      become_user: "{{ ansible_user }}"

    - name: Run configs setup.sh (installs mise and bootstraps tools)
      ansible.builtin.command:
        cmd: bash setup.sh
        chdir: "/home/{{ ansible_user }}/configs"
      become: true
      become_user: "{{ ansible_user }}"
      changed_when: false

    - name: Locate kernel cmdline.txt (Bookworm uses /boot/firmware, older /boot)
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /boot/firmware/cmdline.txt
        - /boot/cmdline.txt
      register: cmdline_stat

    - name: Set cmdline file path fact
      ansible.builtin.set_fact:
        cmdline_file: "{{ (existing_paths + ['/boot/firmware/cmdline.txt']) | first }}"
      vars:
        existing_paths: "{{ cmdline_stat.results | selectattr('stat.exists') | map(attribute='item') | list }}"

    - name: Read kernel cmdline.txt
      ansible.builtin.slurp:
        src: "{{ cmdline_file }}"
      register: cmdline_raw

    - name: Enable memory cgroup for container memory stats (RPi kernel disables it via DTB)
      ansible.builtin.copy:
        dest: "{{ cmdline_file }}"
        mode: '0644'
        content: "{{ new_cmdline }}"
      vars:
        existing_tokens: "{{ (cmdline_raw.content | b64decode | trim).split() | reject('match', '^(cgroup_enable|cgroup_memory|swapaccount)=.*$') | list }}"
        new_cmdline: "{{ (existing_tokens + ['cgroup_enable=memory']) | join(' ') }}\n"
      notify: Reboot to enable memory cgroup

    - name: Reboot to apply memory cgroup (final step; host already configured)
      ansible.builtin.meta: flush_handlers

    - name: Read enabled cgroup controllers
      ansible.builtin.command: cat /sys/fs/cgroup/cgroup.controllers
      changed_when: false
      register: cgroup_controllers

    - name: Read docker info
      ansible.builtin.command: docker info
      changed_when: false
      register: docker_info_out

    - name: Verify memory cgroup is active (Dozzle/docker stats can read memory)
      ansible.builtin.assert:
        that:
          - "'memory' in cgroup_controllers.stdout.split()"
          - "'No memory limit support' not in docker_info_out.stdout"
        fail_msg: "memory cgroup not active; the Pi likely needs a reboot after the cmdline change"

  handlers:
    - name: Restart SSH
      ansible.builtin.service:
        name: ssh
        state: restarted

    - name: Restart Docker
      ansible.builtin.service:
        name: docker
        state: restarted

    - name: Reboot to enable memory cgroup
      ansible.builtin.reboot:
        msg: "Reboot initiated by Ansible to enable memory cgroup"
        connect_timeout: 5
        pre_reboot_delay: 2
        post_reboot_delay: 15
        reboot_timeout: 300
        test_command: uptime
